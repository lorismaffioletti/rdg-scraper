name: Découverte compétitions FFHB

on:
  schedule:
    # Tous les mardis à 7h UTC (9h Paris)
    - cron: '0 7 * * 2'
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le repo
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm install

      - name: Lancer la découverte
        env:
          BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
        run: node scripts/00-find-competitions.js

      - name: Commit du fichier mis à jour
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add competitions-2026-2027.json
          git diff --staged --quiet || git commit -m "Auto: mise à jour competitions-2026-2027.json"
      ;2A;2A;2A;2A;2A
